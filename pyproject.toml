[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2sop"
version = "0.1.0"
description = "Turn an instructor's simulator run into a verified, step-by-step SOP."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=14",
    "duckdb>=0.10",
    "pydantic>=2.5",
    "pyyaml>=6",
    "jinja2>=3.1",
    "httpx>=0.25",
    "ruptures>=1.1",
    "langgraph>=0.2",
    "pynmea2>=1.19",
]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart", "streamlit>=1.32", "plotly>=5.18"]
rag = ["lancedb>=0.6", "pypdf>=4"]
voice = ["faster-whisper>=1.0"]
pdf = ["weasyprint>=60"]
dev = ["pytest>=8"]

[project.scripts]
sim2sop = "sim2sop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sim2sop = ["render/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
